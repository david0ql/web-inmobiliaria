<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <!-- El mapa de la portada tira de las teselas de OSM. Abrir el TLS mientras
         se descarga el resto le ahorra un par de vueltas cuando le toque. -->
    <link rel="preconnect" href="https://a.tile.openstreetmap.org" crossorigin />
    <link rel="dns-prefetch" href="https://b.tile.openstreetmap.org" />
    <link rel="dns-prefetch" href="https://c.tile.openstreetmap.org" />
    <!-- Lo de aqui es el respaldo servido con el HTML: es lo unico que ven
         WhatsApp y Facebook al previsualizar un enlace, porque no ejecutan
         JavaScript. Cada ruta lo reescribe al montar (src/lib/seo.ts) para
         Google, que si renderiza. -->
    <title>
      Serrano Inmobiliaria · Apartamentos, casas y lotes en Bucaramanga
    </title>
    <meta
      name="description"
      content="Inmobiliaria en Bucaramanga con mas de 600 apartamentos, casas y lotes en venta en Floridablanca, Giron y Piedecuesta. Agenda tu visita en linea."
    />
    <link rel="canonical" href="https://web-clientes-inmobiliaria.nordikhat.com/" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1"
    />
    <meta name="author" content="Serrano Inmobiliaria" />
    <meta name="geo.region" content="CO-SAN" />
    <meta name="geo.placename" content="Bucaramanga" />
    <meta property="og:site_name" content="Serrano Inmobiliaria" />
    <meta property="og:locale" content="es_CO" />
    <meta
      property="og:title"
      content="Serrano Inmobiliaria · Apartamentos, casas y lotes en Bucaramanga"
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://web-clientes-inmobiliaria.nordikhat.com/"
    />
    <meta
      property="og:description"
      content="Inmobiliaria en Bucaramanga con mas de 600 apartamentos, casas y lotes en venta en Floridablanca, Giron y Piedecuesta. Agenda tu visita en linea."
    />
    <meta
      property="og:image"
      content="https://web-clientes-inmobiliaria.nordikhat.com/logo.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!--
      El armazon, escrito a mano y servido con el HTML.

      La hoja de estilos bloquea el pintado de todas formas y llega mucho antes
      que el JavaScript; con esto dentro, la barra negra y el logo aparecen en
      cuanto llega el CSS, sin esperar a que React arranque. `createRoot` vacia el
      contenedor en su primer render, asi que esto se sustituye solo.

      Tiene que coincidir con lo que pintan TopBar y SiteHeader, o habra un salto.
    -->
    <div id="root">
      <div class="flex min-h-screen flex-col">
        <section class="border-t-4 border-[#333] bg-[#0d0d0d] text-white">
          <div class="container-site flex items-center justify-between gap-4 py-2">
            <div class="hidden md:block">
              <div class="h-8 w-[280px] rounded-md bg-white/10"></div>
            </div>
            <div class="flex flex-1 items-center justify-center gap-3 md:justify-end">
              <span class="text-xs font-medium tracking-wide">+573222023280</span>
            </div>
          </div>
        </section>
        <header class="border-b bg-background">
          <div class="container-site flex items-center gap-4 py-3">
            <img
              src="/logo.png"
              width="250"
              height="90"
              alt="Serrano Inmobiliaria"
              fetchpriority="high"
              class="h-11 w-auto lg:h-14"
            />
          </div>
        </header>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
